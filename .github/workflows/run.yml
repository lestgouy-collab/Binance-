name: Bot Binance Square
on:
  workflow_dispatch:  # Permite iniciarlo manualmente
  schedule:
    - cron: '*/25 * * * *'  # Se revisa cada 25min, respeta tu intervalo

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10  # No se queda colgado
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar librerías
        run: pip install requests

      - name: Ejecutar el bot
        env:
          BINANCE_KEY: ${{ secrets.BINANCE_KEY }}
        run: python3 bot.py
        
